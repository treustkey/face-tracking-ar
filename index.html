<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Face Tracking - Очки</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="debug" style="position:fixed; top:0; left:0; background:rgba(255,255,0,0.9); 
     z-index:9999; padding:10px; font-size:12px; max-width:300px;"></div>
        <div id="loading">Загрузка AR-маски...</div>
        <div id="instructions">Наведите камеру на лицо</div>
    </div>

    <!-- MindAR библиотеки -->
<script src="https://unpkg.com/mind-ar@1.2.5/dist/mindar-face.prod.js"></script>
<script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
    <script>
    // Диагностика загрузки скриптов
    window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT') {
            alert('❌ Не загрузился скрипт: ' + e.target.src);
            console.error('Script load error:', e.target.src);
        }
    }, true);
    
    window.addEventListener('load', function() {
        console.log('MindARFace:', typeof MindARFace);
        console.log('THREE:', typeof THREE);
        
        if (typeof MindARFace === 'undefined') {
            document.body.innerHTML = '<div style="color:red; padding:20px; font-size:18px;">' +
                '❌ MindAR не загружен!<br>' +
                'Проверьте:<br>' +
                '1. Интернет-соединение<br>' +
                '2. Блокировщик рекламы<br>' +
                '3. Откройте консоль (F12) для деталей</div>';
        }
    });
</script>
    <script>
        const debug = (msg) => {
    const debugDiv = document.getElementById("debug");
    debugDiv.innerHTML += msg + "<br>";
    console.log(msg);
};

const init = async () => {
    try {
        debug("1. Начало инициализации");
        
        // Проверка MindAR
        if (typeof MindARFace === "undefined") {
            debug("❌ MindAR не загружен");
            return;
        }
        debug("2. MindAR загружен ✓");

        const mindarFace = new MindARFace({
            container: document.getElementById("container"),
            filterMinCF: 0.001,
            filterBeta: 10,
            maxTrack: 1
        });
        debug("3. MindARFace создан ✓");

        // Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById("container").appendChild(renderer.domElement);
        debug("4. Three.js рендерер создан ✓");

        // Освещение
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 1, 1);
        scene.add(dirLight);

        // Очки
        const glassesGroup = new THREE.Group();
        const lensGeo = new THREE.TorusGeometry(0.15, 0.02, 16, 32);
        const lensMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.8, roughness: 0.2 });
        
        const leftLens = new THREE.Mesh(lensGeo, lensMat);
        leftLens.position.set(-0.2, 0, 0);
        leftLens.rotation.y = Math.PI / 2;
        glassesGroup.add(leftLens);

        const rightLens = new THREE.Mesh(lensGeo, lensMat);
        rightLens.position.set(0.2, 0, 0);
        rightLens.rotation.y = Math.PI / 2;
        glassesGroup.add(rightLens);

        glassesGroup.scale.set(1.5, 1.5, 1.5);

        const anchor = mindarFace.addAnchor(0);
        anchor.group.add(glassesGroup);
        glassesGroup.position.set(0, 0.05, 0.1);
        debug("5. 3D-объекты созданы ✓");

        // ВАЖНО: prepare()
        debug("6. Загрузка моделей (может занять 5-10 сек)...");
        await mindarFace.prepare();
        debug("7. Модели загружены ✓");

        document.getElementById("loading").style.display = "none";
        document.getElementById("instructions").style.display = "block";

        // Запуск
        debug("8. Запуск AR...");
        const { start, stop } = await mindarFace.start();
        await start();
        debug("9. AR запущен ✓");

        // Проверка video элемента
        setTimeout(() => {
            const video = document.querySelector("video");
            if (video) {
                debug("10. Video элемент найден ✓");
                debug(`Video размер: ${video.videoWidth}x${video.videoHeight}`);
                debug(`Video стиль: ${video.style.cssText}`);
            } else {
                debug("❌ Video элемент НЕ найден!");
            }
        }, 1000);

        renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
        });

    } catch (error) {
        debug("❌ ОШИБКА: " + error.message);
        console.error(error);
    }
};

init();
    </script>
</body>
</html>
