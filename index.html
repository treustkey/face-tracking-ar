<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>MindAR Face — Шляпа</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-face.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #overlay {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      color: #fff; font-family: sans-serif; text-align: center;
      background: rgba(0,0,0,0.7); z-index: 10;
    }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>

<div id="overlay">
  <div>
    <h2>Наведите камеру на лицо</h2>
    <p>Разрешите доступ к камере</p>
  </div>
</div>

<a-scene
  mindar-face
  color-space="srgb"
  renderer="antialias: true; colorManagement: true; physicallyCorrectLights: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

  <!--
    MindAR Face anchors (MediaPipe FaceMesh):
      0 — нос (центр лица)
      8 — лоб (между бровями)
      ...
  -->

  <!-- ============ ШЛЯПА-ЦИЛИНДР: привязана ко лбу (anchor 8) ============ -->
  <a-entity mindar-face-target="anchorIndex: 8">
    <a-entity
      id="hat"
      position="0 0.02 0"
      rotation="-8 0 0"
      scale="0.11 0.11 0.11"
      hat-sway>

      <!-- Поля шляпы (широкий плоский диск) -->
      <a-cylinder position="0 0 0" radius="1.1" height="0.06"
                  color="#1a1a1a" segments-radial="48"
                  metalness="0.2" roughness="0.7"></a-cylinder>

      <!-- Тулья (высокий цилиндр) -->
      <a-cylinder position="0 0.55 0" radius="0.55" height="0.9"
                  color="#111111" segments-radial="36"
                  metalness="0.3" roughness="0.6"></a-cylinder>

      <!-- Верхняя крышка тульи -->
      <a-cylinder position="0 1.0 0" radius="0.55" height="0.04"
                  color="#0a0a0a" segments-radial="36"></a-cylinder>

      <!-- Лента вокруг тульи -->
      <a-cylinder position="0 0.2 0" radius="0.57" height="0.18"
                  color="#8B0000" segments-radial="36"
                  metalness="0.1" roughness="0.8"></a-cylinder>

      <!-- Пряжка на ленте -->
      <a-box position="0 0.2 0.57" width="0.18" height="0.18" depth="0.04"
             color="#FFD700" metalness="0.9" roughness="0.2"></a-box>
      <a-box position="0 0.2 0.58" width="0.10" height="0.10" depth="0.04"
             color="#111111"></a-box>

      <!-- Декоративный цветок сбоку (из 5 лепестков-сфер) -->
      <a-entity position="-0.55 0.35 0.15" rotation="0 0 20">
        <a-sphere position="0      0      0"    radius="0.08" color="#ff3366"></a-sphere>
        <a-sphere position="0.12   0      0"    radius="0.08" color="#ff3366"></a-sphere>
        <a-sphere position="-0.12  0      0"    radius="0.08" color="#ff3366"></a-sphere>
        <a-sphere position="0      0.12   0"    radius="0.08" color="#ff3366"></a-sphere>
        <a-sphere position="0     -0.12   0"    radius="0.08" color="#ff3366"></a-sphere>
        <a-sphere position="0      0      0"    radius="0.06" color="#FFD700"></a-sphere>
      </a-entity>

      <!-- Маленькое перышко, торчащее из-за цветка -->
      <a-cone position="-0.7 0.7 0.1" rotation="0 0 25"
              radius-bottom="0.04" radius-top="0" height="0.5"
              color="#33ccff" segments-radial="12"></a-cone>
    </a-entity>
  </a-entity>

  <!-- ============ АНИМИРОВАННАЯ РАМКА: привязана к носу (anchor 0) ============ -->
  <a-entity mindar-face-target="anchorIndex: 0">
    <a-entity
      id="frame"
      position="0 0 0"
      scale="0.18 0.22 0.18"
      frame-animation>

      <a-box position="0  0.5 0" width="1.05" height="0.05" depth="0.05"
             color="#FFD700" metalness="0.7" roughness="0.25"></a-box>
      <a-box position="0 -0.5 0" width="1.05" height="0.05" depth="0.05"
             color="#FFD700" metalness="0.7" roughness="0.25"></a-box>
      <a-box position="-0.5 0 0" width="0.05" height="1.05" depth="0.05"
             color="#FFD700" metalness="0.7" roughness="0.25"></a-box>
      <a-box position=" 0.5 0 0" width="0.05" height="1.05" depth="0.05"
             color="#FFD700" metalness="0.7" roughness="0.25"></a-box>

      <!-- Угловые «камни» -->
      <a-sphere position="-0.5  0.5 0" radius="0.07" color="#ff3366"></a-sphere>
      <a-sphere position=" 0.5  0.5 0" radius="0.07" color="#33ccff"></a-sphere>
      <a-sphere position="-0.5 -0.5 0" radius="0.07" color="#33ccff"></a-sphere>
      <a-sphere position=" 0.5 -0.5 0" radius="0.07" color="#ff3366"></a-sphere>
    </a-entity>
  </a-entity>

</a-scene>

<script>
/* ---------- Сглаживание позиции/поворота (low-pass filter) ---------- */
AFRAME.registerComponent('smooth-look', {
  schema: { factor: { type: 'number', default: 0.4 } },
  init() {
    this._tP = new THREE.Vector3();
    this._cP = new THREE.Vector3();
    this._tQ = new THREE.Quaternion();
    this._cQ = new THREE.Quaternion();
  },
  tick() {
    const o = this.el.object3D;
    const k = this.data.factor;
    this._tP.copy(o.position);
    this._cP.lerp(this._tP, k);
    o.position.copy(this._cP);
    o.getWorldQuaternion(this._tQ);
    this._cQ.slerp(this._tQ, k);
    o.quaternion.copy(this._cQ);
  }
});

/* ---------- Лёгкое покачивание шляпы (как будто на голове) ---------- */
AFRAME.registerComponent('hat-sway', {
  tick(t) {
    const r = this.el.object3D.rotation;
    r.z = Math.sin(t * 0.0012) * 0.04;   // крен
    r.x = -0.14 + Math.sin(t * 0.0018) * 0.02; // лёгкий наклон вперёд-назад
  }
});

/* ---------- Пульсация и покачивание рамки ---------- */
AFRAME.registerComponent('frame-animation', {
  tick(t) {
    const s = 1 + Math.sin(t * 0.003) * 0.03;
    this.el.object3D.scale.set(0.18 * s, 0.22 * s, 0.18 * s);
    this.el.object3D.rotation.z = Math.sin(t * 0.0015) * 0.05;
  }
});

/* ---------- Применяем сглаживание ко всем target-ам ---------- */
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[mindar-face-target]').forEach(el => {
    el.setAttribute('smooth-look', 'factor: 0.4');
  });
});

/* ---------- Скрываем оверлей после готовности AR ---------- */
const sceneEl = document.querySelector('a-scene');
sceneEl.addEventListener('arReady', () => {
  document.getElementById('overlay').classList.add('hidden');
});
</script>

</body>
</html>
